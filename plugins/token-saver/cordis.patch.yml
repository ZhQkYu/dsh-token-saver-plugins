# Token Saver host plugins. Rows are independent; toggle each on the Plugins page.
- insert:
    - id: token-saver-tool-gate
      name: '@dsh-plugins/token-saver/tool-gate'
      config:
        groups: []
        autoMcpGroups: true
        mcpEnabledByDefault: false
        gateSubagents: true

    - id: token-saver-session-handoff
      name: '@dsh-plugins/token-saver/session-handoff'
      config:
        memoryFile: .dsh/memory.md
        memoryMaxBytes: 16384
        handoffDir: .dsh/handoffs
        suggestAtInputTokens: 600000
        archiveOldSession: true
        titleSuffix: ' (cont.)'

    - id: token-saver-web-ai-bridge
      name: '@dsh-plugins/token-saver/web-ai-bridge'
      config:
        browser:
          mode: launch
          channel: msedge
          headless: false
          args: ['--disable-blink-features=AutomationControlled']
        inputTimeoutMs: 15000
        firstTokenTimeoutMs: 300000
        maxWaitMs: 900000
        stableMs: 2500
        pollMs: 500
        replyMaxChars: 20000
        providers:
          - id: deepseek
            displayName: DeepSeek
            url: https://chat.deepseek.com/
            strengths: reasoning, math, long-form analysis
            enabled: true
            minIntervalMs: 3000
            # Discovered on chat.deepseek.com. ds-message is the stable per-message container;
            # ds-assistant-message-main-content is the assistant's reply body (excludes the
            # reasoning/thinking block). These ds-* classes are DeepSeek's design-system names and
            # do not carry build-hash suffixes. Re-discover with scripts/probe-web-ai.mjs.
            selectors:
              input: 'textarea[placeholder="给 DeepSeek 发送消息 "]'
              message: 'div.ds-message'
              messageContent: 'div.ds-assistant-message-main-content'
              send: ''
              newChat: ''
              busy: ''
              stop: ''
            # Switches set before every ask; enabled: false turns one off. State comes from aria-pressed.
            toggles:
              - name: DeepThink
                selector: 'div.ds-toggle-button:has-text("DeepThink"), div.ds-toggle-button:has-text("深度思考")'
                enabled: true
              - name: Search
                selector: 'div.ds-toggle-button:has-text("Search"), div.ds-toggle-button:has-text("智能搜索"), div.ds-toggle-button:has-text("联网搜索")'
                enabled: true
            # Web subagent: true also registers web_subagent, a read-only ReAct subagent (list_dir,
            # find_files, read_file, grep in the session workspace) that mirrors DSH's `subagent` tool:
            # no tool deadline, final answer only, optional run_in_background job. web_ai_ask stays
            # plain question answering either way.
            agent:
              enabled: true
              maxSteps: 20
              observationMaxChars: 4000
              formatRetries: 2
              contextResetChars: 60000
              pageRetries: 2
          - id: doubao
            displayName: Doubao
            url: https://www.doubao.com/chat/
            strengths: Chinese writing, copywriting, image prompts
            enabled: true
            minIntervalMs: 3000
            # Verified signed in on 2026-09-30. data-testid attributes are stable; the signed-out
            # page shows a hidden ProseMirror editor instead of this textarea.
            selectors:
              input: '[data-testid="chat_input_input"] textarea'
              message: '[data-testid="receive_message"]'
              messageContent: '[data-testid="message_text_content"]'
              newChat: '[data-testid="create_conversation_button"]'
              loggedOut: '[data-testid="to_login_button"]'
          - id: qianwen
            displayName: Qianwen
            url: https://chat.qwen.ai/
            strengths: Chinese knowledge Q&A, summarization
            # Verified signed in. Sending may trigger a slider captcha; solve it once by hand in the
            # bridge's browser window. The answer body excludes the "Thinking completed" card.
            enabled: false
            minIntervalMs: 3000
            selectors:
              input: 'textarea.message-input-textarea'
              message: '.qwen-chat-message-assistant'
              messageContent: '.response-message-content.phase-answer'
              newChat: '[aria-label="New Chat"]'
              stop: '.stop-button'
          - id: zhipu
            displayName: Zhipu
            url: https://chatglm.cn/
            strengths: code generation and explanation
            # Guest replies work. The page also holds a hidden WAF textarea, so the input needs its class.
            # The site may show a slider "Access Verification" page; call web_ai_open and solve it by hand.
            enabled: false
            minIntervalMs: 3000
            selectors:
              input: 'textarea.scroll-display-none'
              message: '.answer'
              # No messageContent: an answer holds two .markdown-body nodes (thinking first, reply
              # last) and no verified selector isolates the reply. The collapsed reply's innerText
              # was "ChatGLM / 思考结束 / <answer>".
              newChat: '.new-session'
          - id: kimi
            displayName: Kimi
            url: https://www.kimi.com/
            strengths: long-document reading, web search summaries
            # Verified signed in. The reply body is the flat markdown; tool-call and thinking blocks are nested deeper.
            enabled: false
            minIntervalMs: 3000
            selectors:
              input: '.chat-input-editor'
              message: '.segment-assistant'
              messageContent: '.toolcall-rollup__flat > .markdown-container'
              newChat: '.new-chat-btn'
              loggedOut: '.login-button'
