# Token Saver host plugins. Rows are independent; toggle each on the Plugins page.
- insert:
    - id: token-saver-tool-gate
      name: '@dsh-plugins/token-saver/tool-gate'
      config:
        groups: []
        autoMcpGroups: true
        mcpEnabledByDefault: false
        gateSubagents: true

    - id: token-saver-session-handoff
      name: '@dsh-plugins/token-saver/session-handoff'
      config:
        memoryFile: .dsh/memory.md
        memoryMaxBytes: 16384
        handoffDir: .dsh/handoffs
        suggestAtInputTokens: 600000
        archiveOldSession: true
        titleSuffix: ' (cont.)'

    - id: token-saver-web-ai-bridge
      name: '@dsh-plugins/token-saver/web-ai-bridge'
      config:
        browser:
          mode: launch
          channel: msedge
          headless: false
          args: ['--disable-blink-features=AutomationControlled']
        inputTimeoutMs: 15000
        firstTokenTimeoutMs: 60000
        maxWaitMs: 300000
        stableMs: 2500
        pollMs: 500
        replyMaxChars: 20000
        providers:
          - id: deepseek
            displayName: DeepSeek
            url: https://chat.deepseek.com/
            strengths: reasoning, math, long-form analysis
            enabled: true
            minIntervalMs: 3000
            # Discovered on chat.deepseek.com. ds-message is the stable per-message container;
            # ds-assistant-message-main-content is the assistant's reply body (excludes the
            # reasoning/thinking block). These ds-* classes are DeepSeek's design-system names and
            # do not carry build-hash suffixes. Re-discover with scripts/probe-web-ai.mjs.
            selectors:
              input: 'textarea[placeholder="给 DeepSeek 发送消息 "]'
              message: 'div.ds-message'
              messageContent: 'div.ds-assistant-message-main-content'
              send: ''
              newChat: ''
              busy: ''
              stop: ''
          - id: doubao
            displayName: Doubao
            url: https://www.doubao.com/chat/
            strengths: Chinese writing, copywriting, image prompts
            enabled: false
            minIntervalMs: 3000
            selectors: { input: '', message: '' }
          - id: qianwen
            displayName: Qianwen
            url: https://chat.qwen.ai/
            strengths: Chinese knowledge Q&A, summarization
            enabled: false
            minIntervalMs: 3000
            selectors: { input: '', message: '' }
          - id: zhipu
            displayName: Zhipu
            url: https://chatglm.cn/
            strengths: code generation and explanation
            enabled: false
            minIntervalMs: 3000
            selectors: { input: '', message: '' }
          - id: kimi
            displayName: Kimi
            url: https://www.kimi.com/
            strengths: long-document reading, web search summaries
            enabled: false
            minIntervalMs: 3000
            selectors: { input: '', message: '' }
